buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.2"
  }
}

apply plugin: "com.android.library"

android {
  compileSdkVersion 33
  namespace "com.developermode"

  defaultConfig {
    minSdkVersion 21
    targetSdkVersion 33
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-native:+"
}
